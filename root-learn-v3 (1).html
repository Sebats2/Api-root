<div class="row np" style="margin:12px 0">${Object.keys(NS).map(k=>`<button class="btn ${k==UR.style?'':'t2'}" data-a="ustyle" data-v="${k}">${k}</button>`).join('')}${nparts(i)>1?`<select id="upt" style="width:auto">${[...Array(nparts(i))].map((_,k)=>`<option value="${k}" ${k==UR.part?'selected':''}>Part ${k+1} of ${nparts(i)}</option>`).join('')}</select>`:''}<input id="usq" placeholder="Search notes" value="${esc(UR.sq)}" style="width:190px;margin-left:auto"></div>

A.uask=async()=>{const i=uimp(),inp=$('#uai'),m=inp.value.trim();if(!m||UR.busy)return;inp.value='';const sc=$('#uas').value,n=unote(),sec=sc!==''&&n?n.sections[+sc]:null;i.chat=(i.chat||[]).concat({r:'u',t:m});const c=$('#uc'),rd=()=>{c.innerHTML=i.chat.map(x=>`<div class="${x.r}">${x.r=='u'?esc(x.t):md(x.t)}</div>`).join('');c.scrollTop=1e9};rd();c.insertAdjacentHTML('beforeend','<div class="mu">Reading the source…</div>');UR.busy=true;

else if(k=='f'){const raw=await aj(sc+`Create ${cnt} flashcards in ${L}. JSON array of {"f":"front","b":"back",${ev}}.`,1),have=new Set(S.cards.map(c=>nz(c.f)));let add=0;raw.forEach(x=>{if(!x||!x.f||!x.b||!grd(x.ev,pl)||have.has(nz(x.f))){drop++;return}have.add(nz(x.f));S.cards.push({id:Date.now()+Math.random(),f:String(x.f),b:String(x.b),deck:i.title.slice(0,60),box:0,due:0,ease:2.5,ivl:0,reps:0,hist:[],src:i.url});add++});if(!add)throw Error('No flashcard could be verified against the source');i.cards=(i.cards||0)+add;save();badge();h=`<div class="card"><b>${add} flashcards added to deck “${esc(i.title.slice(0,60))}”.</b> <a href="#cards">Review them</a></div>`}

PD.res={title:{g:'Glossary',c:'Chapter summaries',x:'Practice exercises'}[k]+': '+i.title,sub,topic:i.title,secs};h=secH(secs)+'<button class="btn t2" data-a="psv">Save to My Library</button>'}}
